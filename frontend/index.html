<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevator RF Survey Manager</title>
<style>
  :root{
    --bg:#f3f5f9; --surface:#ffffff; --border:#e3e7ee; --text:#1a2333; --muted:#667085;
    --accent:#2563eb; --accent-dark:#1d4ed8; --accent-bg:#e8effe;
    --good-bg:#e7f8ee; --good-fg:#0f8a3d;
    --warn-bg:#fdf3d8; --warn-fg:#a06a00;
    --bad-bg:#fde9e9;  --bad-fg:#c62828;
    --nav-bg:#111827; --nav-fg:#c7cdd9; --nav-fg-active:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:60px 1fr;min-height:100vh;
    grid-template-areas:"nav header" "nav main";}
  header{grid-area:header;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:5;}
  header h1{font-size:17px;margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap;}
  header h1 .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .search-box{flex:1;max-width:460px;position:relative;margin-left:16px;}
  .search-box input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);font-size:13px;color:var(--text);}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .user-chip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);
    color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .user-chip button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-weight:600}
  .user-chip button:hover{color:var(--accent)}

  nav{grid-area:nav;background:var(--nav-bg);padding:16px 10px;display:flex;flex-direction:column;gap:2px;}
  nav a{display:flex;align-items:center;gap:10px;color:var(--nav-fg);text-decoration:none;
    font-size:13.5px;padding:10px 12px;border-radius:8px;}
  nav a svg{flex:none;opacity:.85}
  nav a:hover{background:#1c2333;color:var(--nav-fg-active)}
  nav a.active{background:var(--accent);color:#fff}

  main{grid-area:main;padding:24px 28px 48px;max-width:1280px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap}
  .page-head h2{margin:0 0 4px;font-size:24px}
  .page-head p{margin:0;color:var(--muted);font-size:13.5px}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
  button.primary:hover{background:var(--accent-dark)}
  button.primary:disabled{opacity:.5;cursor:default}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px;display:flex;align-items:center;gap:12px;}
  .stat-card .icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .stat-card .n{font-size:22px;font-weight:700;line-height:1.1}
  .stat-card .l{font-size:12.5px;color:var(--muted)}
  .stat-card.total .icon{background:var(--accent-bg);color:var(--accent-dark)}
  .stat-card.feasible .icon{background:var(--good-bg);color:var(--good-fg)}
  .stat-card.attention .icon{background:var(--warn-bg);color:var(--warn-fg)}
  .stat-card.notfeasible .icon{background:var(--bad-bg);color:var(--bad-fg)}
  .skel{display:inline-block;background:var(--bg);border-radius:4px;color:transparent!important;
    animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
  .filter-bar{display:flex;gap:10px;padding:14px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .filter-bar input[type=text],.filter-bar select,.filter-bar input[type=date]{
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text);}
  .filter-bar .grow{flex:1;min-width:200px;position:relative}
  .filter-bar .grow svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5}
  .filter-bar .grow input{width:100%;padding-left:30px}
  .filter-bar .clear{margin-left:auto;background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--border)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--bg)}
  tbody tr.selected{background:var(--accent-bg)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.good{background:var(--good-bg);color:var(--good-fg)}
  .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .pill.status{background:var(--accent-bg);color:var(--accent-dark)}
  .pill.neutral{background:var(--bg);color:var(--muted)}
  .row-actions{display:flex;gap:10px;color:var(--muted)}
  .row-actions button{background:none;border:none;cursor:pointer;color:inherit;padding:2px;display:flex}
  .row-actions button:hover{color:var(--accent)}

  .table-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12.5px;color:var(--muted)}
  .pager{display:flex;gap:4px;align-items:center}
  .pager button{width:28px;height:28px;border:1px solid var(--border);background:var(--surface);border-radius:6px;
    cursor:pointer;font-size:12.5px;color:var(--text)}
  .pager button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager button:disabled{opacity:.4;cursor:default}

  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;flex-wrap:wrap;gap:12px}
  .detail-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detail-title h3{margin:0;font-size:19px}
  .detail-sub{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
  .detail-sub span{display:flex;align-items:center;gap:5px}
  .detail-actions{display:flex;gap:8px;flex:none}
  button.ghost{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.ghost:disabled{opacity:.5;cursor:default}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
  .tabs button{background:none;border:none;padding:12px 6px;margin-right:20px;font-size:13.5px;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
  .tabs button.on{color:var(--accent);border-color:var(--accent)}
  .tab-body{padding:18px 20px 22px}

  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px}
  .card h4{margin:0 0 12px;font-size:13px;display:flex;align-items:center;gap:7px;justify-content:space-between}
  .card h4 .t{display:flex;align-items:center;gap:7px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-weight:600;text-align:right}
  .edit-link{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600}

  table.mini{font-size:12.5px}
  table.mini th,table.mini td{padding:7px 8px}

  .photo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .photo{border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .photo .thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;text-align:center;background:var(--bg);overflow:hidden}
  .photo .thumb img{width:100%;height:100%;object-fit:cover}
  .photo .cap{font-size:11px;padding:5px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .doc-row:last-child{border-bottom:none}
  .banner{font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
  .banner.info{background:var(--accent-bg);color:var(--accent-dark)}
  .banner.error{background:var(--bad-bg);color:var(--bad-fg)}
  .banner.offline{background:var(--warn-bg);color:var(--warn-fg)}
  .banner button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .empty-state{padding:48px 24px;text-align:center;color:var(--muted);font-size:13.5px}
  .connector-label{font-size:16px;font-weight:700;color:var(--accent-dark);background:var(--accent-bg);
    padding:10px 14px;border-radius:8px;display:inline-block}
  @media (max-width:900px){.stat-grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(3,1fr)}}

  .modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50;}
  .modal-overlay[hidden]{display:none}
  .modal{background:var(--surface);border-radius:12px;max-width:960px;width:100%;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .modal.narrow{max-width:380px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:1px solid var(--border);flex:none;}
  .modal-head h3{margin:0;font-size:16px}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px;}
  .modal-close:hover{background:var(--bg);color:var(--text)}
  .modal-body{padding:18px 20px 22px;overflow-y:auto}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:13px}
  .field input{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px}
  .field-error{color:var(--bad-fg);font-size:12px}

  .img-viewer{position:fixed;inset:0;background:rgba(8,10,16,.94);z-index:60;
    display:flex;align-items:center;justify-content:center;touch-action:none;}
  .img-viewer[hidden]{display:none}
  .img-viewer-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:grab;}
  .img-viewer-stage.panning{cursor:grabbing}
  .img-viewer-stage img{max-width:96vw;max-height:96vh;width:auto;height:auto;
    object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform;}
  .img-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
    border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .img-viewer-nav:hover{background:rgba(255,255,255,.24)}
  .img-viewer-nav.prev{left:16px}
  .img-viewer-nav.next{right:16px}
  .img-viewer-counter{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.75);font-size:12.5px;background:rgba(0,0,0,.35);
    padding:4px 12px;border-radius:999px;pointer-events:none;}
</style>
</head>
<body>
<div class="app">
  <nav>
    <a href="#" class="active" data-nav>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17V9m6 8V5M5 21h14a2 2 0 0 0 2-2V7l-4-4H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z"/></svg>
      Surveys
    </a>
    <a href="#" data-nav>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20 3 17V5l6 3m0 12 6-3m-6 3V8m6 9 6 3V10l-6-3m0 12V5m0 3-6-3"/></svg>
      Map View
    </a>
    <a href="#" data-nav>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
      Reports
    </a>
    <a href="#" data-nav>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 11a4 4 0 0 0 0-8m3 17v-2a5 5 0 0 0-3-4.6"/></svg>
      Users
    </a>
    <a href="#" data-nav>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
      Settings
    </a>
  </nav>

  <header>
    <h1><span class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V7l6-4 6 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01"/></svg>
    </span>Elevator RF Survey Manager</h1>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search surveys..." id="headerSearch">
    </div>
    <div class="user-chip">
      <span class="avatar" id="userAvatar">?</span>
      <span id="userLabel">Not signed in</span>
      <button id="authAction" type="button">Sign in</button>
    </div>
  </header>

  <main>
    <div id="banners"></div>
    <div class="page-head">
      <div><h2>Surveys</h2><p>Manage and view all elevator RF survey reports</p></div>
      <button class="primary" disabled title="Creating surveys happens in the mobile app">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New Survey
      </button>
    </div>

    <div class="stat-grid" id="statGrid">
      <div class="stat-card total"><div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg></div><div><div class="n" id="statTotal">–</div><div class="l">Total Surveys</div></div></div>
      <div class="stat-card feasible"><div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg></div><div><div class="n" id="statGood">–</div><div class="l">Feasible Sites</div></div></div>
      <div class="stat-card attention"><div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg></div><div><div class="n" id="statWarn">–</div><div class="l">Need Attention</div></div></div>
      <div class="stat-card notfeasible"><div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6m0-6 6 6"/></svg></div><div><div class="n" id="statBad">–</div><div class="l">Not Feasible</div></div></div>
    </div>

    <div class="panel">
      <div class="filter-bar">
        <div class="grow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="fSearch" placeholder="Search by site name, client, survey number...">
        </div>
        <select id="fStatus"><option value="">All Statuses</option><option value="Good">Feasible</option><option value="Acceptable">Need Attention</option><option value="Poor">Not Feasible</option></select>
        <select id="fModel"><option value="">All Models</option></select>
        <select id="fConnector"><option value="">All Connector Types</option></select>
        <input type="date" id="fDateFrom" title="From date">
        <input type="date" id="fDateTo" title="To date">
        <button class="clear" id="fClear">Clear</button>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>#</th><th>Date</th><th>Site Name</th><th>Elevator Company</th><th>Elevator Model</th>
          <th>Connector Type</th><th>Floors</th><th>Feasibility</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      </div>
      <div class="table-foot">
        <span id="pageInfo"></span>
        <div style="display:flex;align-items:center;gap:16px">
          <div class="pager" id="pager"></div>
          <label>Rows per page:
            <select id="pageSize" style="border:1px solid var(--border);border-radius:6px;padding:4px 6px;margin-left:4px">
              <option>5</option><option selected>10</option><option>25</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <div class="panel" id="detail"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="img-viewer" id="imgViewer" hidden>
  <div class="img-viewer-stage" id="imgViewerStage">
    <img id="imgViewerImg" src="" alt="" draggable="false">
  </div>
  <button class="img-viewer-nav prev" id="imgViewerPrev" aria-label="Previous photo">&lsaquo;</button>
  <button class="img-viewer-nav next" id="imgViewerNext" aria-label="Next photo">&rsaquo;</button>
  <div class="img-viewer-counter" id="imgViewerCounter"></div>
</div>

<script>
/* =====================================================================
 * API client -- typed via JSDoc (this project ships as a single static
 * HTML/JS file with no build step, on purpose: see docs/BUILD_SPEC.pdf
 * and the repo README. A real TypeScript client would need a bundler,
 * which is a bigger infra change than this pass -- so "typed" here means
 * every request/response shape is documented with a JSDoc @typedef
 * matching the backend's Pydantic models field-for-field, and every
 * client function is annotated with @param/@returns against those types.
 * ================================================================== */

const API_BASE = (window.API_BASE || "http://localhost:8000") + "/api/v1";
const TOKEN_KEY = "svs_auth_token";
const TOKEN_USER_KEY = "svs_auth_user";

/** @typedef {{total:number, good:number, acceptable:number, poor:number}} DashboardSummary */
/** @typedef {{id:string, survey_number:string, status:string, date:string, site:string, client:string,
 *             elevator_id:string, oem:string, model:string, floors:number, verdict:string,
 *             connector_type:string|null}} SurveyListItem */
/** @typedef {{items:SurveyListItem[], total:number, page:number, page_size:number}} SurveyListResponse */
/** @typedef {{models:string[], connector_types:string[]}} SurveyFacets */
/** @typedef {{type:string|null, positions:number|null, pitch_mm:number|null, gender:string|null,
 *             compatible_part_note:string|null}} ConnectorInfo */
/** @typedef {{button_module_sku:string, connectors:string, connector:ConnectorInfo|null,
 *             pinout:Array<{pin:number,use:string,color:string}>}} Integration */
/** @typedef {{report_id:string, file_id:string, format:string, created_at:string,
 *             original_filename:string|null, byte_size:number|null}} ReportItem */

/** Thrown by apiFetch; `kind` is one of "offline" | "auth-required" | "api-error". */
class ApiError extends Error {
  constructor(kind, message, status) {
    super(message);
    this.kind = kind;
    this.status = status;
  }
}

/**
 * @param {string} path path under /api/v1, e.g. "/surveys"
 * @param {{method?:string, body?:object, auth?:boolean}} [opts]
 * @returns {Promise<any>} parsed JSON body
 */
async function apiFetch(path, opts = {}) {
  const { method = "GET", body, auth = false } = opts;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    throw new ApiError("offline", "You appear to be offline.");
  }
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (auth) {
    const token = getToken();
    if (!token) throw new ApiError("auth-required", "Sign in required.");
    headers["Authorization"] = `Bearer ${token}`;
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new ApiError("offline", "Can't reach the server. Check your connection.");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch (_) {}
    if (res.status === 401) throw new ApiError("auth-required", detail, 401);
    throw new ApiError("api-error", detail, res.status);
  }
  return res;
}

/** @returns {Promise<DashboardSummary>} */
function getDashboardSummary() {
  return apiFetch("/dashboard/summary").then(r => r.json());
}

/** @returns {Promise<SurveyFacets>} */
function getSurveyFacets() {
  return apiFetch("/surveys/facets").then(r => r.json());
}

/**
 * @param {{q?:string, verdict?:string, model?:string, connector_type?:string,
 *          date_from?:string, date_to?:string, sort?:string, order?:string,
 *          page?:number, page_size?:number}} params
 * @returns {Promise<SurveyListResponse>}
 */
function listSurveys(params = {}) {
  const qs = new URLSearchParams();
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") qs.set(k, v); });
  return apiFetch(`/surveys?${qs.toString()}`).then(r => r.json());
}

/** @param {string} id @returns {Promise<object>} full survey detail */
function getSurvey(id) {
  return apiFetch(`/surveys/${encodeURIComponent(id)}`).then(r => r.json());
}

/** @param {string} id @returns {Promise<{items:ReportItem[]}>} */
function listReports(id) {
  return apiFetch(`/surveys/${encodeURIComponent(id)}/reports`).then(r => r.json());
}

/** @param {string} id @param {string} reportId @returns {Promise<Blob>} */
async function downloadReport(id, reportId) {
  const res = await apiFetch(`/surveys/${encodeURIComponent(id)}/reports/${encodeURIComponent(reportId)}/download`, { auth: true });
  return res.blob();
}

/** @param {string} email @param {string} password @returns {Promise<{access_token:string, user:object}>} */
function login(email, password) {
  return apiFetch("/auth/login", { method: "POST", body: { email, password } }).then(r => r.json());
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getStoredUser() { try { return JSON.parse(localStorage.getItem(TOKEN_USER_KEY) || "null"); } catch (_) { return null; } }
function setAuth(token, user) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(TOKEN_USER_KEY, JSON.stringify(user));
  renderAuthChip();
}
function clearAuth() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(TOKEN_USER_KEY);
  renderAuthChip();
}

/* =====================================================================
 * Display-only mapping. Source data (API + DB) always carries the raw
 * Good/Acceptable/Poor verdict values -- this table exists purely to
 * satisfy the dashboard's own visual language and is never written back.
 * ================================================================== */
const VERDICT_LABEL = { Good: "Feasible", Acceptable: "Need Attention", Poor: "Not Feasible" };
const VERDICT_CLASS = { Good: "good", Acceptable: "warn", Poor: "bad" };
function verdictLabel(v) { return VERDICT_LABEL[v] || v || "—"; }
function verdictClass(v) { return VERDICT_CLASS[v] || "neutral"; }

/* =====================================================================
 * State + boot
 * ================================================================== */
const state = {
  page: 1, pageSize: 10,
  filters: { q: "", verdict: "", model: "", connector_type: "", date_from: "", date_to: "" },
  sort: "date", order: "desc",
  list: { loading: true, error: null, data: null },
  summary: { loading: true, error: null, data: null },
  facets: { models: [], connector_types: [] },
  selectedId: null,
  detail: { loading: false, error: null, data: null },
};

function banner(kind, message, { retry } = {}) {
  const el = document.createElement("div");
  el.className = `banner ${kind}`;
  el.innerHTML = `<span>${message}</span>`;
  if (retry) {
    const btn = document.createElement("button");
    btn.textContent = "Retry";
    btn.addEventListener("click", retry);
    el.appendChild(btn);
  }
  return el;
}

function renderBanners() {
  const host = document.getElementById("banners");
  host.innerHTML = "";
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    host.appendChild(banner("offline", "You're offline — showing the last data loaded. Changes can't be fetched right now."));
    return;
  }
  if (state.summary.error && state.summary.error.kind === "offline") {
    host.appendChild(banner("offline", "Can't reach the server. Is the backend running?", { retry: loadAll }));
    return;
  }
  if (state.summary.error) {
    host.appendChild(banner("error", `Dashboard summary failed to load: ${state.summary.error.message}`, { retry: loadAll }));
  }
  if (state.list.error && state.list.error.kind !== "offline") {
    host.appendChild(banner("error", `Survey list failed to load: ${state.list.error.message}`, { retry: loadList }));
  }
}

function renderAuthChip() {
  const user = getStoredUser();
  document.getElementById("userLabel").textContent = user ? user.display_name || user.email : "Not signed in";
  document.getElementById("userAvatar").textContent = user ? (user.display_name || user.email || "?").slice(0, 2).toUpperCase() : "?";
  document.getElementById("authAction").textContent = user ? "Sign out" : "Sign in";
}
document.getElementById("authAction").addEventListener("click", () => {
  if (getStoredUser()) { clearAuth(); }
  else openLoginModal();
});

async function loadAll() {
  await Promise.all([loadSummary(), loadFacets(), loadList()]);
}

async function loadSummary() {
  state.summary.loading = true; renderStats();
  try {
    state.summary.data = await getDashboardSummary();
    state.summary.error = null;
  } catch (e) {
    state.summary.error = e;
  }
  state.summary.loading = false;
  renderStats(); renderBanners();
}

async function loadFacets() {
  try {
    const f = await getSurveyFacets();
    state.facets = f;
    renderFacetOptions();
  } catch (e) { /* filter dropdowns just stay at "All ..." if this fails -- non-fatal */ }
}

function renderFacetOptions() {
  const modelSel = document.getElementById("fModel");
  const connSel = document.getElementById("fConnector");
  const rebuild = (sel, values, allLabel) => {
    const current = sel.value;
    sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join("");
    sel.value = values.includes(current) ? current : "";
  };
  rebuild(modelSel, state.facets.models, "All Models");
  rebuild(connSel, state.facets.connector_types, "All Connector Types");
}

async function loadList() {
  state.list.loading = true; renderTable();
  try {
    state.list.data = await listSurveys({
      ...state.filters,
      sort: state.sort, order: state.order,
      page: state.page, page_size: state.pageSize,
    });
    state.list.error = null;
  } catch (e) {
    state.list.error = e;
    state.list.data = null;
  }
  state.list.loading = false;
  renderTable(); renderBanners();
}

/* ---- stat cards ---------------------------------------------------- */
function renderStats() {
  const ids = { total: "statTotal", good: "statGood", acceptable: "statWarn", poor: "statBad" };
  Object.entries(ids).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if (state.summary.loading) { el.textContent = "···"; el.classList.add("skel"); return; }
    el.classList.remove("skel");
    el.textContent = state.summary.data ? state.summary.data[key] : "—";
  });
}

/* ---- filters wiring -------------------------------------------------- */
let searchDebounce;
function onFilterChange() {
  state.page = 1;
  loadList();
}
document.getElementById("fSearch").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { state.filters.q = e.target.value.trim(); onFilterChange(); }, 350);
});
document.getElementById("headerSearch").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  const v = e.target.value.trim();
  searchDebounce = setTimeout(() => {
    document.getElementById("fSearch").value = v;
    state.filters.q = v; onFilterChange();
  }, 350);
});
document.getElementById("fStatus").addEventListener("change", e => { state.filters.verdict = e.target.value; onFilterChange(); });
document.getElementById("fModel").addEventListener("change", e => { state.filters.model = e.target.value; onFilterChange(); });
document.getElementById("fConnector").addEventListener("change", e => { state.filters.connector_type = e.target.value; onFilterChange(); });
document.getElementById("fDateFrom").addEventListener("change", e => { state.filters.date_from = e.target.value; onFilterChange(); });
document.getElementById("fDateTo").addEventListener("change", e => { state.filters.date_to = e.target.value; onFilterChange(); });
document.getElementById("fClear").addEventListener("click", () => {
  state.filters = { q: "", verdict: "", model: "", connector_type: "", date_from: "", date_to: "" };
  document.getElementById("fSearch").value = "";
  document.getElementById("headerSearch").value = "";
  document.getElementById("fStatus").value = "";
  document.getElementById("fModel").value = "";

  document.getElementById("fDateFrom").value = "";
  document.getElementById("fDateTo").value = "";

});
document.getElementById("pageSize").addEventListener("change", e => { state.pageSize = +e.target.value; state.page = 1; loadList(); });

/* ---- table ------------------------------------------------------------ */
function renderTable() {
  const tbody = document.getElementById("tbody");

  if (state.list.loading) {
    tbody.innerHTML = Array.from({ length: 4 }).map(() =>
      `<tr>${Array.from({ length: 10 }).map(() => `<td><span class="skel">████</span></td>`).join("")}</tr>`
    ).join("");
    renderPager(0);
    document.getElementById("pageInfo").textContent = "Loading…";
    return;
  }

  if (state.list.error) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty-state">Couldn't load surveys. ${state.list.error.message || ""}</td></tr>`;
    renderPager(0);
    document.getElementById("pageInfo").textContent = "";
    return;
  }

  const data = state.list.data;
  const items = data ? data.items : [];
  const total = data ? data.total : 0;
  const hasFilters = Object.values(state.filters).some(Boolean);

  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty-state">${
      hasFilters ? "No surveys match these filters." : "No surveys yet — completed surveys from the mobile app will appear here once submitted."
    }</td></tr>`;
    renderPager(total);
    document.getElementById("pageInfo").textContent = hasFilters ? "No matches" : "No surveys";
    return;
  }

  const start = (state.page - 1) * state.pageSize;
  tbody.innerHTML = items.map((s, i) => `
    <tr data-id="${s.id}" class="${s.id === state.selectedId ? "selected" : ""}">
      <td>${start + i + 1}</td>
      <td>${s.date || "—"}</td>
      <td>${s.site || "—"}</td>
      <td>${s.oem || "—"}</td>
      <td>${s.model || "—"}</td>
      <td>${s.connector_type || "Not recorded"}</td>
      <td>${s.floors ?? "—"}</td>
      <td>${s.verdict ? `<span class="pill ${verdictClass(s.verdict)}">${verdictLabel(s.verdict)}</span>` : "—"}</td>
      <td><span class="pill status">${s.status}</span></td>
      <td><div class="row-actions">
        <button title="View" data-view="${s.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></td>
    </tr>`).join("");

  tbody.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.addEventListener("click", () => selectSurvey(tr.dataset.id));
  });
  tbody.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); selectSurvey(b.dataset.view); }));

  document.getElementById("pageInfo").textContent = `Showing ${start + 1} to ${Math.min(start + state.pageSize, total)} of ${total} surveys`;
  renderPager(total);
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  const pager = document.getElementById("pager");
  let html = `<button ${state.page === 1 ? "disabled" : ""} data-p="prev">&lsaquo;</button>`;
  for (let p = 1; p <= pages; p++) html += `<button class="${p === state.page ? "on" : ""}" data-p="${p}">${p}</button>`;
  html += `<button ${state.page === pages ? "disabled" : ""} data-p="next">&rsaquo;</button>`;
  pager.innerHTML = html;
  pager.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.p === "prev") state.page = Math.max(1, state.page - 1);
    else if (b.dataset.p === "next") state.page = Math.min(pages, state.page + 1);
    else state.page = +b.dataset.p;
    loadList();
  }));
}

/* ---- detail panel ------------------------------------------------------ */
let activeTab = "Summary";
const TABS = ["Summary", "RF Results", "Railing Measurements", "Pinout & Integration", "Photos", "Documents"];

async function selectSurvey(id) {
  state.selectedId = id;
  renderTable();
  state.detail = { loading: true, error: null, data: null };
  renderDetail();
  try {
    state.detail.data = await getSurvey(id);
  } catch (e) {
    state.detail.error = e;
  }
  state.detail.loading = false;
  renderDetail();
  document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderDetail() {
  const host = document.getElementById("detail");
  if (!state.selectedId) { host.innerHTML = ""; return; }

  if (state.detail.loading) {
    host.innerHTML = `<div class="empty-state">Loading survey…</div>`;
    return;
  }
  if (state.detail.error) {
    const e = state.detail.error;
    const msg = e.kind === "offline" ? "Can't reach the server." : (e.message || "Failed to load this survey.");
    host.innerHTML = `<div class="empty-state">${msg}<br><button class="ghost" style="margin-top:10px" id="retryDetail">Retry</button></div>`;
    document.getElementById("retryDetail").addEventListener("click", () => selectSurvey(state.selectedId));
    return;
  }

  const s = state.detail.data;
  const overall = (s.rf && s.rf.summary && s.rf.summary.overall) || {};
  const verdict = overall.verdict || "";

  host.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">
          <h3>${(s.header && s.header.site_name_snapshot) || "Untitled site"}</h3>
          ${verdict ? `<span class="pill ${verdictClass(verdict)}">${verdictLabel(verdict)}</span>` : ""}
        </div>
        <div class="detail-sub">
          <span>${(s.header && s.header.client_snapshot) || "—"} &nbsp;|&nbsp; ${s.elevator_id || "—"}</span>
        </div>
        <div class="detail-sub">
          <span>Survey Date: ${(s.header && s.header.date) || "—"}</span>
          <span>${(s.rf && s.rf.floor_count) ?? "—"} Floors</span>
          <span>Prepared by: ${(s.header && s.header.prepared_by) || "—"}</span>
        </div>
      </div>
    </div>
    <div class="tabs">
      ${TABS.map(t => `<button data-tab="${t}" class="${t === activeTab ? "on" : ""}">${t}</button>`).join("")}
    </div>
    <div class="tab-body" id="tabBody"></div>
  `;
  host.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { activeTab = b.dataset.tab; renderDetail(); }));

  const body = document.getElementById("tabBody");
  if (activeTab === "Summary") body.innerHTML = summaryTab(s);
  else if (activeTab === "RF Results") body.innerHTML = rfTab(s);
  else if (activeTab === "Railing Measurements") renderRailingTab(body, s);
  else if (activeTab === "Pinout & Integration") body.innerHTML = integrationTab(s);
  else if (activeTab === "Photos") body.innerHTML = folderGrid(s);
  else renderDocumentsTab(body, s);

  body.querySelectorAll("[data-full-rf]").forEach(el => el.addEventListener("click", () => openRfModal(s)));
  body.querySelectorAll("[data-open-folder]").forEach(el =>
    el.addEventListener("click", () => openPhotoFolder(s, +el.dataset.openFolder)));
}

// Group photos into their source folders (Exterior Photos / Panel / Elevator
// Roof Mounting Point, etc. -- matches the real folder names the importer used).
// Photos without a `group` (older imports) each become their own single-photo
// folder rather than silently disappearing.
function photoFolders(s) {
  const photos = s.photos || [];
  const order = [], byGroup = {};
  photos.forEach(p => {
    const key = p.group || p.description || p.filename || "Photos";
    if (!byGroup[key]) { byGroup[key] = []; order.push(key); }
    byGroup[key].push(p);
  });
  return order.map(key => ({ name: key, photos: byGroup[key] }));
}

function folderGrid(s) {
  const folders = photoFolders(s);
  if (!folders.length) return `<p style="color:var(--muted);font-size:13px">No photos recorded for this survey.</p>`;
  return `<div class="photo-grid">
    ${folders.map((f, i) => {
      const cover = f.photos[0];
      return `<div class="photo" data-open-folder="${i}">
        <div class="thumb" style="position:relative">
          ${cover.url ? `<img src="${cover.url}" alt="${f.name}" loading="lazy">` : f.name}
          ${f.photos.length > 1 ? `<span style="position:absolute;bottom:4px;right:4px;background:rgba(17,24,39,.75);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:999px">${f.photos.length}</span>` : ""}
        </div>
        <div class="cap">${f.name}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function openPhotoFolder(s, folderIndex) {
  const folder = photoFolders(s)[folderIndex];
  document.getElementById("modalTitle").textContent = folder.name;
  document.getElementById("modalBody").innerHTML = `<div class="photo-grid">
    ${folder.photos.map((p, i) => `
      <div class="photo" data-open-photo="${i}">
        <div class="thumb">${p.url ? `<img src="${p.url}" alt="${p.description || p.filename}" loading="lazy">` : (p.description || p.filename || "Photo")}</div>
        <div class="cap">${p.description || p.filename || "Photo"}</div>
      </div>`).join("")}

  document.getElementById("modalOverlay").hidden = false;
  document.getElementById("modalBody").querySelectorAll("[data-open-photo]").forEach(el =>
    el.addEventListener("click", () => openImageViewer(folder, +el.dataset.openPhoto)));
}

/* Flat "<row>|<carrier>.<metric>" cell keys, preserved verbatim end to end
   (BUILD_SPEC section 4.4/4.6) -- parsed here only for display. */
function parseRfSection(section) {
  const rows = {};
  Object.entries(section.cells || {}).forEach(([key, value]) => {
    const [row, rest] = key.split("|");
    rows[row] = rows[row] || { row, loc: null, du: {}, et: {} };
    if (rest === "loc") { rows[row].loc = value; return; }
    const [carrier, metric] = rest.split(".");
    if (carrier === "du" || carrier === "et") rows[row][carrier][metric] = value;
  });
  return Object.values(rows).sort((a, b) => Number(a.row) - Number(b.row));
}

function rfTab(s) {
  const sections = Object.entries((s.rf && s.rf.sections) || {});
  if (!sections.length) return `<p style="color:var(--muted);font-size:13px">No RF measurements recorded for this survey.</p>`;
  return sections.map(([key, section]) => {
    const rows = parseRfSection(section);
    return `<h4 style="font-size:13px;margin:0 0 8px">${section.name || key}</h4>
    <table class="mini" style="margin-bottom:18px">
      <thead><tr><th>Row</th><th>DU RSRP</th><th>DU SINR</th><th>e&amp; RSRP</th><th>e&amp; SINR</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${r.loc || r.row}</td>
        <td>${r.du.rsrp ?? "—"}</td><td>${r.du.sinr ?? "—"}</td>
        <td>${r.et.rsrp ?? "—"}</td><td>${r.et.sinr ?? "—"}</td>
      </tr>`).join("")}</tbody>
    </table>`;
  }).join("") + `<button class="ghost" style="margin-top:4px" data-full-rf>View Full RF (all columns) &rsaquo;</button>`;
}

function fullRfTable(s) {
  const sections = Object.entries((s.rf && s.rf.sections) || {});
  const c = v => v === undefined || v === null ? "—" : v;
  return sections.map(([key, section]) => {
    const rows = parseRfSection(section);
    return `<h4 style="font-size:13px;margin:0 0 8px">${section.name || key}</h4>
    <div style="overflow-x:auto"><table class="mini" style="margin-bottom:18px">
      <thead><tr>
        <th>Location</th>
        <th colspan="6" style="text-align:center;border-left:2px solid var(--border)">Carrier #1 — DU</th>
        <th colspan="6" style="text-align:center;border-left:2px solid var(--border)">Carrier #2 — Etisalat</th>
      </tr>
      <tr><th></th>
        <th style="border-left:2px solid var(--border)">RSRP</th><th>RSRQ</th><th>SINR</th><th>Band</th><th>DL</th><th>UL</th>
        <th style="border-left:2px solid var(--border)">RSRP</th><th>RSRQ</th><th>SINR</th><th>Band</th><th>DL</th><th>UL</th>
      </tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${r.loc || r.row}</td>
        <td style="border-left:2px solid var(--border)">${c(r.du.rsrp)}</td><td>${c(r.du.rsrq)}</td><td>${c(r.du.sinr)}</td><td>${c(r.du.band)}</td><td>${c(r.du.dl)}</td><td>${c(r.du.ul)}</td>
        <td style="border-left:2px solid var(--border)">${c(r.et.rsrp)}</td><td>${c(r.et.rsrq)}</td><td>${c(r.et.sinr)}</td><td>${c(r.et.band)}</td><td>${c(r.et.dl)}</td><td>${c(r.et.ul)}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
  }).join("") + `<p style="color:var(--muted);font-size:12px">Every row transcribed verbatim from the report's RF sections — DL/UL in Mbps.</p>`;
}

function openRfModal(s) {
  document.getElementById("modalTitle").textContent = `Full RF Measurements — ${s.header && s.header.site_name_snapshot || ""}`;
  document.getElementById("modalBody").innerHTML = fullRfTable(s);
  document.getElementById("modalOverlay").hidden = false;
}

function renderRailingTab(body, s) {
  const sides = ["top", "rear", "left", "right"];
  const railings = s.railings || {};
  body.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:14px" id="railingSideBtns">
      ${sides.map((side, i) => `<button class="ghost" data-side="${side}" style="${i === 0 ? "background:var(--accent);color:#fff;border-color:var(--accent)" : ""}">${side[0].toUpperCase() + side.slice(1)}</button>`).join("")}
    </div>
    <div id="railingSideBody"></div>
    ${railings.note ? `<p style="color:var(--muted);font-size:12px;margin-top:12px">${railings.note}</p>` : ""}
  `;
  const showSide = side => {
    body.querySelectorAll("#railingSideBtns button").forEach(b =>
      b.style.cssText = b.dataset.side === side ? "background:var(--accent);color:#fff;border-color:var(--accent)" : "");
    const r = railings[side] || {};
    const dims = Object.entries(r.dimensions_mm || {});
    document.getElementById("railingSideBody").innerHTML = dims.length
      ? `<table class="mini"><thead><tr><th>Point</th><th>Dimension (mm)</th></tr></thead>
         <tbody>${dims.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table>
         ${r.drawing && r.drawing.length ? `<p style="color:var(--muted);font-size:12px;margin-top:10px">This side also has ${r.drawing.length} recorded sketch stroke(s) -- diagram rendering from stroke data isn't built in this pass, only the numeric dimensions above.</p>` : ""}`
      : `<p style="color:var(--muted);font-size:13px">No dimensions recorded for this side.</p>`;
  };
  body.querySelectorAll("#railingSideBtns button").forEach(b => b.addEventListener("click", () => showSide(b.dataset.side)));
  showSide(sides[0]);
}

function integrationTab(s) {
  const integ = s.integration || {};
  const c = integ.connector;
  const parts = [];
  if (c) {
    if (c.type) parts.push(c.type);
    if (c.positions) parts.push(`${c.positions}-pin`);
    if (c.pitch_mm) parts.push(`${c.pitch_mm} mm`);
    if (c.gender) parts.push(c.gender);
  }
  const label = parts.length ? parts.join(" · ") : "Not recorded";

  return `
  <div class="grid3" style="grid-template-columns:1fr 1fr">
    <div class="card">
      <h4><span class="t">🔌 Connector</span></h4>
      <div class="connector-label">${label}</div>
      ${c && c.compatible_part_note ? `<p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">${c.compatible_part_note}</p>` : ""}
      <dl class="kv" style="margin-top:14px">
        <dt>Button module SKU</dt><dd>${integ.button_module_sku || "—"}</dd>
        <dt>Connector notes</dt><dd style="text-align:left">${integ.connectors || "—"}</dd>
      </dl>
    </div>
    <div class="card">
      <h4><span class="t">📌 Pinout</span></h4>
      ${integ.pinout && integ.pinout.length ? `<table class="mini">
        <thead><tr><th>Pin</th><th>Use</th><th>Color</th></tr></thead>
        <tbody>${integ.pinout.map(p => `<tr><td>${p.pin}</td><td>${p.use || "—"}</td><td>${p.color || "—"}</td></tr>`).join("")}</tbody>
      </table>` : `<p style="color:var(--muted);font-size:13px">No pinout recorded.</p>`}
    </div>
  </div>`;
}

function renderDocumentsTab(body, s) {
  body.innerHTML = `<div class="empty-state">Loading documents…</div>`;
  listReports(s.id).then(({ items }) => {
    if (!items.length) { body.innerHTML = `<p style="color:var(--muted);font-size:13px">No reports generated for this survey yet.</p>`; return; }
    body.innerHTML = items.map(r => `
      <div class="doc-row">
        <div><div style="font-weight:600">${r.original_filename || r.report_id + ".docx"}</div>
          <div style="color:var(--muted);font-size:12px">${r.format.toUpperCase()}${r.byte_size ? " · " + Math.round(r.byte_size / 1024) + " KB" : ""} · ${new Date(r.created_at).toLocaleDateString()}</div></div>
        <button class="ghost" data-download="${r.report_id}">Download</button>
      </div>`).join("");
    body.querySelectorAll("[data-download]").forEach(btn =>
      btn.addEventListener("click", () => handleDownload(s.id, btn.dataset.download, btn)));
  }).catch(e => {
    const msg = e.kind === "offline" ? "Can't reach the server." : (e.message || "Failed to load documents.");
    body.innerHTML = `<div class="empty-state">${msg}</div>`;
  });
}

async function handleDownload(surveyId, reportId, btn) {
  if (!getToken()) { openLoginModal(() => handleDownload(surveyId, reportId, btn)); return; }
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Downloading…";
  try {
    const blob = await downloadReport(surveyId, reportId);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${reportId}.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    if (e.kind === "auth-required") { clearAuth(); openLoginModal(() => handleDownload(surveyId, reportId, btn)); }
    else alert(`Download failed: ${e.message || "unknown error"}`);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

/* =====================================================================
 * Login modal (reuses the generic modal) -- the one auth surface this
 * dashboard needs: downloading a DOCX report is the only protected route
 * in this phase.
 * ================================================================== */
function openLoginModal(onSuccess) {
  document.getElementById("modalDialog").classList.add("narrow");
  document.getElementById("modalTitle").textContent = "Sign in";
  document.getElementById("modalBody").innerHTML = `
    <p style="font-size:12.5px;color:var(--muted);margin-top:0">Sign in to download DOCX reports.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <div class="field-error" id="loginError" hidden></div>
      <button class="primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>`;
  document.getElementById("modalOverlay").hidden = false;
  document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.hidden = true;
    try {
      const { access_token, user } = await login(email, password);
      setAuth(access_token, user);
      document.getElementById("modalOverlay").hidden = true;
      document.getElementById("modalDialog").classList.remove("narrow");
      if (onSuccess) onSuccess();
    } catch (e) {
      errEl.textContent = e.kind === "offline" ? "Can't reach the server." : (e.message || "Sign in failed.");
      errEl.hidden = false;
    }
  });
}

/* =====================================================================
 * Generic modal close wiring + fullscreen photo viewer (unchanged from
 * the previous build -- pinch/wheel-zoom and drag-pan scoped to the
 * image itself, arrow-key navigation between photos).
 * ================================================================== */
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("modalOverlay").hidden = true;
  document.getElementById("modalDialog").classList.remove("narrow");
});
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target.id === "modalOverlay") {
    document.getElementById("modalOverlay").hidden = true;
    document.getElementById("modalDialog").classList.remove("narrow");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("imgViewer").hidden) {
  document.getElementById("modalOverlay").hidden = true;
  document.getElementById("modalDialog").classList.remove("narrow");
}});

const imgViewerState = { scale: 1, tx: 0, ty: 0, folder: null, index: -1 };

function openImageViewer(folder, index) {
  imgViewerState.folder = folder;
  imgViewerState.index = index;
  loadImgViewerPhoto();
  document.getElementById("imgViewer").hidden = false;
}
function loadImgViewerPhoto() {
  const p = imgViewerState.folder.photos[imgViewerState.index];
  const img = document.getElementById("imgViewerImg");
  img.src = p.url || "";
  img.alt = p.description || p.filename || "";
  imgViewerState.scale = 1; imgViewerState.tx = 0; imgViewerState.ty = 0;
  applyImgViewerTransform();
  const n = imgViewerState.folder.photos.length;
  document.getElementById("imgViewerCounter").textContent = n > 1 ? `${imgViewerState.index + 1} / ${n} — ${p.description || p.filename || ""}` : (p.description || p.filename || "");
  document.getElementById("imgViewerPrev").hidden = n <= 1;
  document.getElementById("imgViewerNext").hidden = n <= 1;
}
function stepImgViewer(dir) {
  const n = imgViewerState.folder.photos.length;
  if (n <= 1) return;
  imgViewerState.index = (imgViewerState.index + dir + n) % n;
  loadImgViewerPhoto();
}
function closeImageViewer() { document.getElementById("imgViewer").hidden = true; }
function applyImgViewerTransform() {
  document.getElementById("imgViewerImg").style.transform = `translate(${imgViewerState.tx}px, ${imgViewerState.ty}px) scale(${imgViewerState.scale})`;
}
(function initImgViewer() {
  const overlay = document.getElementById("imgViewer");
  const stage = document.getElementById("imgViewerStage");
  const pointers = new Map();
  let mode = null, panStart = null, pinchStart = null, moved = false;
  const clampScale = s => Math.min(6, Math.max(1, s));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const zoomAt = (clientX, clientY, newScale) => {
    const rect = stage.getBoundingClientRect();
    const stageCx = rect.left + rect.width / 2, stageCy = rect.top + rect.height / 2;
    const imgCx = stageCx + imgViewerState.tx, imgCy = stageCy + imgViewerState.ty;
    const localX = (clientX - imgCx) / imgViewerState.scale, localY = (clientY - imgCy) / imgViewerState.scale;
    imgViewerState.scale = newScale;
    imgViewerState.tx = clientX - stageCx - newScale * localX;
    imgViewerState.ty = clientY - stageCy - newScale * localY;
    applyImgViewerTransform();
  };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pointers.size === 1) { mode = "pan"; panStart = { x: e.clientX, y: e.clientY, tx: imgViewerState.tx, ty: imgViewerState.ty }; }
    else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; mode = "pinch"; pinchStart = { dist: dist(a, b), scale: imgViewerState.scale }; }
  });
  stage.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === "pan" && panStart) {
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      imgViewerState.tx = panStart.tx + dx; imgViewerState.ty = panStart.ty + dy;
      stage.classList.add("panning"); applyImgViewerTransform();
    } else if (mode === "pinch" && pinchStart && pointers.size === 2) {
      moved = true;
      const [a, b] = [...pointers.values()];
      const newScale = clampScale(pinchStart.scale * (dist(a, b) / pinchStart.dist));
      const c = mid(a, b);
      zoomAt(c.x, c.y, newScale);
    }
  });
  const endPointer = e => {
    pointers.delete(e.pointerId);
    stage.classList.remove("panning");
    if (pointers.size === 1) { const [p1] = [...pointers.values()]; mode = "pan"; panStart = { x: p1.x, y: p1.y, tx: imgViewerState.tx, ty: imgViewerState.ty }; }
    else if (pointers.size === 0) { if (!moved && e.target === stage) closeImageViewer(); mode = null; }
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", e => { e.preventDefault(); const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15; zoomAt(e.clientX, e.clientY, clampScale(imgViewerState.scale * factor)); }, { passive: false });
  stage.addEventListener("dblclick", e => {
    if (imgViewerState.scale > 1) { imgViewerState.scale = 1; imgViewerState.tx = 0; imgViewerState.ty = 0; applyImgViewerTransform(); }
    else zoomAt(e.clientX, e.clientY, 2.5);
  });
  document.getElementById("imgViewerPrev").addEventListener("click", e => { e.stopPropagation(); stepImgViewer(-1); });
  document.getElementById("imgViewerNext").addEventListener("click", e => { e.stopPropagation(); stepImgViewer(1); });
  document.addEventListener("keydown", e => {
    if (overlay.hidden) return;
    if (e.key === "Escape") closeImageViewer();
    else if (e.key === "ArrowLeft") stepImgViewer(-1);
    else if (e.key === "ArrowRight") stepImgViewer(1);
  });
})();

/* ---- offline/online banner refresh ---------------------------------- */
window.addEventListener("online", () => { renderBanners(); loadAll(); });
window.addEventListener("offline", renderBanners);

renderAuthChip();
renderBanners();
loadAll();
</script>
