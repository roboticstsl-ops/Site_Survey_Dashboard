[project]
name = "elevator-rf-survey-backend"
version = "0.1.0"
description = "FastAPI backend for the Elevator RF Survey dashboard/sync API (see docs/BUILD_SPEC.pdf)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "motor>=3.5",            # async MongoDB driver (Atlas)
  "python-jose[cryptography]>=3.3",  # JWT
  "passlib[argon2]>=1.7",  # password hashing (Argon2id, per spec)
  "python-multipart>=0.0.9",  # file uploads
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
